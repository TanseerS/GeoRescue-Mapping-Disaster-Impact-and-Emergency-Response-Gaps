# AWS SAM CLI configuration for the GeoRescue data pipeline.
# Region comes from your AWS profile unless you pass --region.
version = 0.1

[default.global.parameters]
stack_name = "georescue"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
